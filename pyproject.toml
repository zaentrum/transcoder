[project]
name = "transcoder"
version = "0.1.0"
description = "Video-prep worker for katalog. Consumes stube.catalog.item.analyzed from Kafka (group transcoder-workers), re-encodes non-HEVC video to HEVC (NVENC, or libx265/libx264 without a GPU) plus an optional rendition ladder into intermediate MKVs in the item's inbox (the worker record's library.inboxDir on the v2 library layout, else /var/lib/katalog/packages/_inbox/{itemId}/) with a renditions.json handoff, reports transcode=done/skipped/failed back over HTTP, and produces stube.catalog.item.transcoded. The downstream katalog-packager then packages the renditions with shaka-packager. Runs in its own pod (1x NVIDIA GPU per replica on GPU hosts, or CPU-only)."
requires-python = ">=3.10"
dependencies = [
  # Kafka client for the event chain (consume analyzed / produce
  # transcoded). The manylinux wheel bundles librdkafka, so no
  # apt/Dockerfile change is needed on the cuda/ubuntu base.
  "confluent-kafka==2.5.3",
  # HTTP client to katalog API (get_item, get_steps, upsert_step). Sync
  # because one GPU encode at a time saturates a single 3090, so per-item
  # latency dominates anything HTTP-related.
  "httpx==0.28.1",
  # Structured JSON logs — same processor stack as packager/analyzer so
  # log routing rules apply uniformly.
  "structlog==25.4.0",
  # Tiny FastAPI surface for /healthz + /readyz. Runs side-car to the
  # worker loop in the same process so kubelet probes work.
  "fastapi==0.118.0",
  "uvicorn[standard]==0.32.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.7.0",
  "pytest==8.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
